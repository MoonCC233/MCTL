name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: |
          set +e
          go test -v ./... 2>&1 | tee test-results.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' test-results.txt | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 200 test-results.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
